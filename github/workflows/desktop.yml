name: Gerar App Desktop Windows (.exe)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Dependências
        run: npm install

      - name: Compilar Executável Windows
        run: npm run dist

      - name: Disponibilizar o Executável para Download
        uses: actions/upload-artifact@v4
        with:
          name: Gestao-Equipes-Windows
          path: dist/*.exe
