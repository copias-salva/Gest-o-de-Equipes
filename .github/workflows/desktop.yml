name: Build Desktop Executable

on:
  push:
    branches: [ main, principal ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Create App Icon
      run: |
        pip install pillow
        python -c "
        from PIL import Image, ImageDraw
        img = Image.new('RGBA', (256, 256), (0, 0, 0, 0))
        draw = ImageDraw.Draw(img)
        draw.rounded_rectangle([8, 8, 248, 248], radius=40, fill=(24, 32, 54, 255))
        draw.ellipse([50, 80, 86, 116], fill=(100, 130, 175, 255))
        draw.ellipse([30, 120, 106, 220], fill=(100, 130, 175, 255))
        draw.ellipse([170, 80, 206, 116], fill=(100, 130, 175, 255))
        draw.ellipse([150, 120, 226, 220], fill=(100, 130, 175, 255))
        draw.ellipse([110, 60, 146, 96], fill=(140, 170, 215, 255))
        draw.ellipse([90, 100, 166, 210], fill=(140, 170, 215, 255))
        draw.ellipse([70, 110, 110, 150], fill=(0, 122, 255, 255))
        draw.ellipse([45, 155, 135, 240], fill=(0, 122, 255, 255))
        draw.ellipse([146, 110, 186, 150], fill=(52, 199, 89, 255))
        draw.ellipse([121, 155, 211, 240], fill=(52, 199, 89, 255))
        img.save('icon.ico', format='ICO', sizes=[(256, 256), (128, 128), (64, 64), (48, 48), (32, 32), (16, 16)])
        "

    - name: Install dependencies
      run: npm install

    - name: Build Electron App
      run: npm run dist

    - name: Upload Executable
      uses: actions/upload-artifact@v4
      with:
        name: GestaoDeEquipes-Windows
        path: dist/*.exe
