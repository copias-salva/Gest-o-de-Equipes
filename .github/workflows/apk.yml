name: Gerar APK Android

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Criar Projeto Capacitor
        run: |
          mkdir build
          cp index.html build/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "GestaoEquipes" "com.gestao.app" --web-dir build
          npx cap add android
          npx cap sync android

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Compilar APK Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar o APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: App-Gestao-Equipes
          path: android/app/build/outputs/apk/debug/app-debug.apk
